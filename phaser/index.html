<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0611">
  <link rel="manifest" href="./manifest.json">
  <title>Angelic Black — Call of the Abyss</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/eb-garamond@latest/index.css">
  <style>
    :root{color-scheme:dark;background:#05030a}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a}
    body{display:flex;align-items:center;justify-content:center}
    #game-root{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
    canvas{image-rendering:pixelated;touch-action:none}
    #rotate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#05030a;color:#b18cff;font:600 18px Georgia,serif;letter-spacing:.18em;text-align:center;padding:24px}
    #start-overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(5,3,10,.94);color:#e7d8f2;font:600 16px Georgia,serif;text-align:center;letter-spacing:.08em;padding:24px;cursor:pointer}
    #engine-status{position:fixed;inset:auto 20px 20px 20px;z-index:40;display:none;background:#180a12;color:#ffb3c1;border:1px solid #8d3148;padding:14px 16px;border-radius:8px;font:14px monospace;line-height:1.45;text-align:center}
    @media (orientation:portrait){#rotate{display:flex}#game-root{display:none}#start-overlay{display:none}}
    @media (pointer:fine){#start-overlay{display:none}}
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="rotate">ROTATE TO LANDSCAPE</div>
  <div id="start-overlay">TAP TO ENTER THE ABYSS<br><br><small>Fullscreen and landscape mode will be requested where supported.</small></div>
  <div id="engine-status"></div>
  <script>
    (function(){
      const gate=document.getElementById('start-overlay');
      function enter(){
        gate.style.display='none';
        try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement){const p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}}catch(e){}
        try{if(screen.orientation&&screen.orientation.lock){const p=screen.orientation.lock('landscape');if(p&&p.catch)p.catch(()=>{});}}catch(e){}
      }
      gate.addEventListener('pointerdown',enter,{once:true});
    })();
  </script>
  <script src="js/boot/EngineLoader.js?v=20260823-m29"></script>
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=6',{scope:'./'}).then(r=>r.update()).catch(()=>{}));}
  </script>
</body>
</html>
