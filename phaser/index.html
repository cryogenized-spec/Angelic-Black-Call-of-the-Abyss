<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0611">
  <link rel="manifest" href="./manifest.json">
  <title>Angelic Black — Phaser 4</title>
  <style>
    :root{color-scheme:dark;background:#05030a}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a}
    body{display:flex;align-items:center;justify-content:center}
    #game-root{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
    canvas{image-rendering:pixelated;touch-action:none}
    #rotate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#05030a;color:#b18cff;font:600 18px Georgia,serif;letter-spacing:.18em;text-align:center;padding:24px}
    #start-overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(5,3,10,.92);color:#e7d8f2;font:600 16px Georgia,serif;text-align:center;letter-spacing:.08em;padding:24px;cursor:pointer}
    @media (orientation:portrait){#rotate{display:flex}#game-root{display:none}#start-overlay{display:none}}
    @media (pointer:fine){#start-overlay{display:none}}
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="rotate">ROTATE TO LANDSCAPE</div>
  <div id="start-overlay">TAP TO ENTER THE ABYSS<br><small>Fullscreen + landscape mode will be requested where supported.</small></div>
  <script>
    (function(){
      const gate=document.getElementById('start-overlay');
      async function enter(){
        try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen();}catch(e){}
        try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}
        gate.style.display='none';
      }
      gate.addEventListener('pointerdown',enter,{once:true});
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/[email protected]/dist/phaser.js"></script>
  <script src="js/config.js"></script>
  <script src="js/player/QueenAssetCatalog.js"></script>
  <script src="js/player/NecroQueen.js"></script>
  <script src="js/world/FirstTombWorld.js"></script>
  <script src="js/fx/FXEngine.js"></script>
  <script src="js/fx/FXEvents.js"></script>
  <script src="js/combat/EnemyRoster.js"></script>
  <script src="js/combat/PickupSystem.js"></script>
  <script src="js/combat/SpellSystem.js"></script>
  <script src="js/combat/CombatSystem.js"></script>
  <script src="js/combat/WaveSystem.js"></script>
  <script src="js/progression/ProgressionSystem.js"></script>
  <script src="js/debug/RuntimeAudit.js"></script>
  <script src="js/narrative/NarrativeDirector.js"></script>
  <script src="js/input/TouchControls.js"></script>
  <script src="js/ui/Level1Menu.js"></script>
  <script src="js/scenes/BootScene.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
