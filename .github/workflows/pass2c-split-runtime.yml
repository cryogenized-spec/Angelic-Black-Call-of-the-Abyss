name: Pass 2C runtime split

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  split-runtime:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Split runtime
        run: python3 tools/split-runtime.py

      - name: Validate generated files
        run: |
          test -f src/game.html
          test -f src/js/game.js
          test -d src/js/modules
          grep -q 'js/modules/' src/game.html
          ! grep -q 'src="js/game.js"' src/game.html

      - name: Commit generated modules
        run: |
          if git diff --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/game.html src/js/modules
          git commit -m "Pass 2C: split runtime into ordered modules"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
