name: Pass 2B — Extract game modules

on:
  push:
    branches: [pass-2-engine-refactor-b]
    paths:
      - 'src/game.html'
      - 'tools/extract-monolith.py'
      - '.github/workflows/pass2-extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract CSS and JavaScript
        run: python3 tools/extract-monolith.py

      - name: Verify extracted runtime
        run: |
          test -s src/css/game.css
          test -s src/js/game.js
          ! grep -q '<style>' src/game.html
          ! grep -q '<script>$' src/game.html
          grep -q 'href="css/game.css"' src/game.html
          grep -q 'src="js/game.js"' src/game.html

      - name: Commit extracted modules
        run: |
          if git diff --quiet; then
            echo 'No extraction changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.html src/css/game.css src/js/game.js
          git commit -m 'Pass 2B: extract CSS and JavaScript modules [skip ci]'
          git push
